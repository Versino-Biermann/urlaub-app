<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Grande Virée</title>
    <script>
      // Gespeicherte Theme-Wahl VOR dem ersten Paint setzen, sonst blitzt
      // kurz das System-Theme auf, bevor React rendert. Bewusst inline und
      // synchron im <head> - genau dafuer ist diese Ausnahme da.
      (function () {
        try {
          var modus = localStorage.getItem('urlaub-app.theme')
          if (modus === 'light' || modus === 'dark') {
            document.documentElement.setAttribute('data-theme', modus)
          }
        } catch (e) {
          /* kein Storage (privater Modus) -> Systemeinstellung greift */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
