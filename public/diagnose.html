<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>urlaub-app Diagnose</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 18px;
        line-height: 1.5;
        color: #16232b;
        background: #f6f7f5;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 20px;
        margin: 24px 0 8px;
      }
      .box {
        background: #fff;
        border: 1px solid #ccd3d6;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }
      .umgebung {
        font-size: 15px;
      }
      .umgebung div {
        margin-bottom: 6px;
      }
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font-size: 19px;
        font-family: inherit;
        padding: 16px 12px;
        margin-bottom: 12px;
        border: 1px solid #1f5f6b;
        border-radius: 8px;
        background: #1f5f6b;
        color: #fff;
        text-align: left;
        cursor: pointer;
      }
      button:active {
        background: #15454e;
      }
      #ergebnisse {
        font-size: 16px;
      }
      .eintrag {
        border-top: 1px solid #ccd3d6;
        padding: 10px 0;
      }
      .eintrag:first-child {
        border-top: 0;
      }
      .titel {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .fehler .titel {
        color: #a12b16;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 15px;
      }
      .hinweis {
        font-size: 15px;
        color: #4a5a61;
      }
    </style>
  </head>
  <body>
    <h1>urlaub-app Diagnose</h1>
    <p class="hinweis">
      Diese Seite liest nur. Sie schreibt nichts in den Browser-Speicher und
      importiert keine Daten. Ergebnisse bleiben stehen, bis die Seite neu
      geladen wird.
    </p>

    <div class="box umgebung" id="umgebung"></div>

    <button type="button" id="knopf1">1 - Was ist gespeichert?</button>
    <button type="button" id="knopf2">2 - Test A: Download ohne Widerruf</button>
    <button type="button" id="knopf3">3 - Test B: Download wie die App</button>
    <button type="button" id="knopf4">4 - Test C: Dateiauswahl</button>

    <input
      type="file"
      id="dateiauswahl"
      accept="application/json,.json"
      style="display: none"
    />

    <h2>Ergebnisse</h2>
    <div class="box" id="ergebnisse">
      <div class="eintrag hinweis">Noch keine Messung ausgefuehrt.</div>
    </div>

    <script>
      (function () {
        'use strict';

        var STORAGE_KEYS = {
          etappen: 'urlaub-app.etappen',
          bookings: 'urlaub-app.bookings',
          route: 'urlaub-app.route',
          sightseeing: 'urlaub-app.sightseeing',
          events: 'urlaub-app.events',
          restaurants: 'urlaub-app.restaurants'
        };

        var ergebnisse = document.getElementById('ergebnisse');
        var ersterEintrag = true;

        function zeitstempel() {
          var d = new Date();
          function p(n) {
            return String(n).padStart(2, '0');
          }
          return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        function melde(titel, text, istFehler) {
          if (ersterEintrag) {
            ergebnisse.textContent = '';
            ersterEintrag = false;
          }
          var block = document.createElement('div');
          block.className = istFehler ? 'eintrag fehler' : 'eintrag';

          var kopf = document.createElement('div');
          kopf.className = 'titel';
          kopf.textContent = '[' + zeitstempel() + '] ' + titel;
          block.appendChild(kopf);

          var koerper = document.createElement('pre');
          koerper.textContent = text;
          block.appendChild(koerper);

          ergebnisse.appendChild(block);
        }

        function fehlerText(e) {
          if (!e) return 'Unbekannter Fehler (kein Fehlerobjekt).';
          if (e instanceof Error) {
            return e.name + ': ' + e.message + (e.stack ? '\n' + e.stack : '');
          }
          try {
            return String(e);
          } catch (x) {
            return 'Fehler nicht darstellbar.';
          }
        }

        // --- Globale Fehleranzeige ---------------------------------------
        window.addEventListener('error', function (ev) {
          var stelle = '';
          if (ev && ev.filename) {
            stelle = '\n' + ev.filename + ':' + ev.lineno + ':' + ev.colno;
          }
          melde(
            'GLOBALER FEHLER (window.onerror)',
            (ev && ev.message ? ev.message : 'ohne Meldung') +
              stelle +
              (ev && ev.error ? '\n' + fehlerText(ev.error) : ''),
            true
          );
        });

        window.addEventListener('unhandledrejection', function (ev) {
          melde(
            'GLOBALER FEHLER (unhandledrejection)',
            fehlerText(ev && ev.reason),
            true
          );
        });

        // --- Umgebung ----------------------------------------------------
        function zeigeUmgebung() {
          var ziel = document.getElementById('umgebung');
          var zeilen = [
            ['Adresse', window.location.href],
            ['Origin', window.location.origin],
            ['User-Agent', navigator.userAgent],
            ['Plattform', navigator.platform || '(nicht gemeldet)'],
            ['Sprache', navigator.language || '(nicht gemeldet)'],
            [
              'Anzeige',
              window.screen.width +
                'x' +
                window.screen.height +
                ' / Fenster ' +
                window.innerWidth +
                'x' +
                window.innerHeight +
                ' / DPR ' +
                window.devicePixelRatio
            ],
            [
              'Standalone-Modus',
              (window.matchMedia &&
              window.matchMedia('(display-mode: standalone)').matches
                ? 'ja (Startbildschirm/PWA-Fenster)'
                : 'nein (normaler Browser-Tab)')
            ],
            ['Zeitpunkt', new Date().toString()]
          ];
          for (var i = 0; i < zeilen.length; i++) {
            var d = document.createElement('div');
            var b = document.createElement('strong');
            b.textContent = zeilen[i][0] + ': ';
            d.appendChild(b);
            d.appendChild(document.createTextNode(String(zeilen[i][1])));
            ziel.appendChild(d);
          }
        }

        // --- Nur-Lesen-Zugriff auf localStorage --------------------------
        function leseRoh(storageKey) {
          // Ausschliesslich lesender Zugriff. Diese Datei schreibt nie in den Speicher.
          return window.localStorage.getItem(storageKey);
        }

        function analysiereKey(storageKey) {
          var roh;
          try {
            roh = leseRoh(storageKey);
          } catch (e) {
            return {
              zustand: 'ZUGRIFF FEHLGESCHLAGEN',
              anzahl: null,
              detail: fehlerText(e),
              liste: []
            };
          }

          if (roh === null) {
            return {
              zustand: 'KEY EXISTIERT NICHT',
              anzahl: null,
              detail: 'getItem lieferte null',
              liste: []
            };
          }
          if (roh === '') {
            return {
              zustand: 'LEERER STRING',
              anzahl: null,
              detail: 'Key existiert, Inhalt ist leer',
              liste: []
            };
          }

          var wert;
          try {
            wert = JSON.parse(roh);
          } catch (e) {
            return {
              zustand: 'PARSEN GESCHEITERT',
              anzahl: null,
              detail:
                fehlerText(e) +
                '\nAnfang des Rohtextes: ' +
                roh.slice(0, 120),
              liste: []
            };
          }

          if (Array.isArray(wert)) {
            if (wert.length === 0) {
              return {
                zustand: 'LEERES JSON (leere Liste)',
                anzahl: 0,
                detail: 'Zeichen im Speicher: ' + roh.length,
                liste: []
              };
            }
            return {
              zustand: 'OK',
              anzahl: wert.length,
              detail: 'Zeichen im Speicher: ' + roh.length,
              liste: wert
            };
          }

          return {
            zustand: 'KEIN ARRAY (' + typeof wert + ')',
            anzahl: null,
            detail: 'Rohtext-Anfang: ' + roh.slice(0, 120),
            liste: []
          };
        }

        function sammleAlles() {
          var ergebnis = { berichte: {}, daten: {}, gesamtzeichen: 0 };
          for (var dataKey in STORAGE_KEYS) {
            if (!Object.prototype.hasOwnProperty.call(STORAGE_KEYS, dataKey)) {
              continue;
            }
            var bericht = analysiereKey(STORAGE_KEYS[dataKey]);
            ergebnis.berichte[dataKey] = bericht;
            ergebnis.daten[dataKey] = bericht.liste;
          }
          return ergebnis;
        }

        // --- Knopf 1 -----------------------------------------------------
        document.getElementById('knopf1').addEventListener('click', function () {
          try {
            var alles = sammleAlles();
            var zeilen = [];
            var summe = 0;
            for (var dataKey in STORAGE_KEYS) {
              if (!Object.prototype.hasOwnProperty.call(STORAGE_KEYS, dataKey)) {
                continue;
              }
              var b = alles.berichte[dataKey];
              zeilen.push(
                dataKey +
                  ' (' +
                  STORAGE_KEYS[dataKey] +
                  ')\n  Zustand: ' +
                  b.zustand +
                  '\n  Eintraege: ' +
                  (b.anzahl === null ? '-' : b.anzahl) +
                  '\n  Detail: ' +
                  b.detail
              );
              if (typeof b.anzahl === 'number') summe += b.anzahl;
            }
            zeilen.push('Summe aller Eintraege: ' + summe);
            melde('Knopf 1 - Was ist gespeichert?', zeilen.join('\n\n'), false);
          } catch (e) {
            melde('Knopf 1 - FEHLGESCHLAGEN', fehlerText(e), true);
          }
        });

        // --- Download-Tests A und B --------------------------------------
        function baueBackupText() {
          var alles = sammleAlles();
          var backup = {
            app: 'urlaub-app',
            version: 1,
            exportedAt: new Date().toISOString(),
            data: alles.daten
          };
          return JSON.stringify(backup, null, 2);
        }

        function downloadTest(dateiname, mitWiderruf, knopfName) {
          var text = baueBackupText();
          var blob = new Blob([text], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = dateiname;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          if (mitWiderruf) {
            URL.revokeObjectURL(url);
          }
          melde(
            knopfName,
            'Klick auf <a download> wurde ausgeloest.\n' +
              'Dateiname: ' +
              dateiname +
              '\n' +
              'Groesse der Daten: ' +
              text.length +
              ' Zeichen\n' +
              'Blob-URL: ' +
              url +
              '\n' +
              'revokeObjectURL: ' +
              (mitWiderruf
                ? 'JA, unmittelbar nach click() und removeChild() - exakt wie die App'
                : 'NEIN, die Blob-URL bleibt gueltig') +
              '\n\nBitte nachsehen, ob im Download-Bereich eine Datei angekommen ist.',
            false
          );
        }

        document.getElementById('knopf2').addEventListener('click', function () {
          try {
            downloadTest(
              'test-A-ohne-widerruf.json',
              false,
              'Knopf 2 - Test A: Download ohne Widerruf'
            );
          } catch (e) {
            melde('Knopf 2 - Test A FEHLGESCHLAGEN', fehlerText(e), true);
          }
        });

        document.getElementById('knopf3').addEventListener('click', function () {
          try {
            downloadTest(
              'test-B-mit-widerruf.json',
              true,
              'Knopf 3 - Test B: Download wie die App'
            );
          } catch (e) {
            melde('Knopf 3 - Test B FEHLGESCHLAGEN', fehlerText(e), true);
          }
        });

        // --- Knopf 4: Dateiauswahl + confirm-nach-await -------------------
        var dateiauswahl = document.getElementById('dateiauswahl');

        document.getElementById('knopf4').addEventListener('click', function () {
          try {
            // Zuruecksetzen, damit dieselbe Datei mehrfach getestet werden kann.
            dateiauswahl.value = '';
            melde(
              'Knopf 4 - Test C: Dateiauswahl',
              'Dateiauswahl wird geoeffnet. Es wird nichts eingelesen und nichts importiert.',
              false
            );
            dateiauswahl.click();
          } catch (e) {
            melde('Knopf 4 - Oeffnen FEHLGESCHLAGEN', fehlerText(e), true);
          }
        });

        dateiauswahl.addEventListener('change', async function (event) {
          try {
            var datei =
              event.target.files && event.target.files.length
                ? event.target.files[0]
                : null;

            if (!datei) {
              melde(
                'Test C - Ergebnis Dateiauswahl',
                'Keine Datei ausgewaehlt (Auswahl abgebrochen oder Browser lieferte kein File-Objekt).',
                false
              );
              return;
            }

            melde(
              'Test C - Ergebnis Dateiauswahl',
              'Datei ausgewaehlt: JA\n' +
                'Name: ' +
                datei.name +
                '\n' +
                'type (MIME laut Browser): ' +
                (datei.type === '' ? '(leer - Browser meldet keinen Typ)' : datei.type) +
                '\n' +
                'Groesse: ' +
                datei.size +
                ' Byte\n' +
                'Zuletzt geaendert: ' +
                new Date(datei.lastModified).toString() +
                '\n' +
                'accept-Attribut war: ' +
                dateiauswahl.getAttribute('accept') +
                '\n\nInhalt wurde NICHT gelesen, nichts wurde importiert.',
              false
            );

            // Zweite Messung: erzeugt window.confirm nach einem await noch einen Dialog?
            var vorher = Date.now();
            await new Promise(function (aufloesen) {
              setTimeout(aufloesen, 0);
            });
            var wartezeit = Date.now() - vorher;

            var antwort;
            var confirmFehler = null;
            var vorConfirm = Date.now();
            try {
              antwort = window.confirm(
                'TEST - es passiert nichts. Siehst du diesen Dialog? Bitte auf OK tippen.'
              );
            } catch (e) {
              confirmFehler = e;
            }
            var dauer = Date.now() - vorConfirm;

            if (confirmFehler) {
              melde(
                'Test C - confirm nach await',
                'window.confirm hat einen Fehler geworfen:\n' + fehlerText(confirmFehler),
                true
              );
              return;
            }

            melde(
              'Test C - confirm nach await',
              'Aufruf erfolgte nach einem echten await (Wartezeit ' +
                wartezeit +
                ' ms), also genau wie in DataBackup.jsx nach await file.text().\n' +
                'Rueckgabewert von window.confirm: ' +
                String(antwort) +
                '\n' +
                'Zeit im confirm-Aufruf: ' +
                dauer +
                ' ms\n\n' +
                'Deutung fuer den Screenshot:\n' +
                '- Dialog erschienen und OK getippt -> Rueckgabe true, Zeit deutlich ueber 0 ms.\n' +
                '- Dialog erschienen und Abbrechen getippt -> Rueckgabe false, Zeit deutlich ueber 0 ms.\n' +
                '- Kein Dialog gesehen und Rueckgabe false bei etwa 0 ms -> der Browser hat den Dialog unterdrueckt.',
              false
            );
          } catch (e) {
            melde('Test C - FEHLGESCHLAGEN', fehlerText(e), true);
          }
        });

        zeigeUmgebung();
      })();
    </script>
  </body>
</html>
